<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'">
<title>3D Airport Globe</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#404045;color:#d0d8f0;font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden;height:100vh;width:100vw}
#cv{position:absolute;inset:0}
canvas{display:block}
/* panel base */
.P{position:absolute;z-index:10;background:rgba(6,10,24,0.93);backdrop-filter:blur(18px);border:1px solid rgba(80,130,255,0.13);border-radius:12px}
#ctrl{top:12px;left:12px;width:316px;padding:12px 14px;max-height:calc(100vh - 24px);display:flex;flex-direction:column;gap:0}
#info{bottom:12px;right:12px;padding:12px 20px;text-align:left;min-width:280px;max-width:420px;display:none}
#legend{top:12px;right:12px;width:196px;padding:12px 14px;font-size:11px;line-height:1.7}
#tooltip{position:absolute;z-index:20;background:rgba(4,8,22,0.97);border:1px solid rgba(80,130,255,0.28);border-radius:8px;padding:9px 13px;pointer-events:none;display:none;max-width:260px;font-size:12px}
/* tabs */
.tabs{display:flex;gap:4px;margin-bottom:7px;flex-wrap:wrap}
.tab{padding:5px 10px;border-radius:6px;border:1px solid rgba(80,130,255,0.15);background:rgba(80,130,255,0.05);color:#7898c0;cursor:pointer;font-size:11px;transition:all .15s;white-space:nowrap}
.tab:hover{background:rgba(80,130,255,0.13)}
.tab.on{background:rgba(80,160,255,0.22);border-color:rgba(80,130,255,0.45);color:#9cc8ff}
/* search */
.sb{width:100%;padding:7px 11px;background:rgba(255,255,255,0.05);border:1px solid rgba(80,130,255,0.18);border-radius:7px;color:#d0d8f0;font-size:12px;outline:none;margin-bottom:4px}
.sb:focus{border-color:rgba(80,130,255,0.5)}
.sb::placeholder{color:rgba(180,200,230,0.3)}
/* airport list */
.al{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(80,130,255,0.2) transparent;min-height:0}
.ai{padding:5px 8px;border-radius:5px;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:12px;transition:background .1s}
.ai:hover{background:rgba(80,130,255,0.1)}
.ai.sel{background:rgba(80,160,255,0.16);border-left:2px solid #5b9aff}
.ai .cd{font-weight:700;color:#7ab4ff;font-size:13px;min-width:36px}
.ai .nm{color:#8898b8;font-size:10px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai .bd{font-size:10px;font-weight:600;margin-left:auto;white-space:nowrap;color:#5bffb0}
/* range */
.rc{margin-top:8px;padding-top:8px;border-top:1px solid rgba(80,130,255,0.08);font-size:10px;color:#6878a0}
.rc input[type=range]{width:100%;accent-color:#5b9aff;margin-top:3px}
.rv{text-align:right;font-size:11px;color:#7ab4ff;font-weight:600}
/* unit toggle */
.unit-toggle{display:flex;gap:0;border:1px solid rgba(80,130,255,0.25);border-radius:6px;overflow:hidden;margin-left:8px}
.unit-btn{padding:3px 9px;font-size:11px;font-weight:600;cursor:pointer;background:rgba(80,130,255,0.05);color:#6888b0;transition:all .15s;border:none;outline:none}
.unit-btn.on{background:rgba(80,160,255,0.22);color:#a0ccff}
.unit-btn:hover:not(.on){background:rgba(80,130,255,0.12);color:#88aacc}
/* ── Terminator (day/night) ── */
#terminator-wrap{position:absolute;z-index:10;top:12px;right:220px;background:rgba(6,10,24,0.92);backdrop-filter:blur(18px);border:1px solid rgba(80,130,255,0.13);border-radius:12px;padding:10px 14px;font-size:11px;color:#6888b0;min-width:200px}
#terminator-wrap .tw-title{font-size:11px;font-weight:600;color:#7ab4ff;margin-bottom:6px;display:flex;align-items:center;gap:5px}
.tw-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;gap:8px}
.tw-row label{display:flex;align-items:center;gap:5px;cursor:pointer;font-size:11px;color:#7898b8}
.tw-row input[type=checkbox]{accent-color:#5b9aff;width:13px;height:13px}
.tw-row input[type=time],.tw-row input[type=date],.tw-row input[type=datetime-local]{
  background:rgba(80,130,255,0.10);border:1px solid rgba(80,130,255,0.28);border-radius:6px;
  color:#a0ccff;font-size:13px;padding:6px 8px;outline:none;width:auto;min-width:0;flex:1;
  font-variant-numeric:tabular-nums;cursor:pointer;
  color-scheme:dark;   /* Chromeのカレンダー/時計ピッカーを暗色テーマにする */
}
.tw-row input[type=time]:hover,.tw-row input[type=date]:hover{background:rgba(80,130,255,0.16)}
.tw-row input[type=time]:focus,.tw-row input[type=date]:focus,.tw-row input[type=datetime-local]:focus{
  border-color:rgba(80,160,255,0.6);background:rgba(80,130,255,0.16)}
/* Chromeのカレンダー/時計アイコンを見えるようにする(既定は暗くて視認不可) */
.tw-row input[type=date]::-webkit-calendar-picker-indicator,
.tw-row input[type=time]::-webkit-calendar-picker-indicator{
  filter:invert(72%) sepia(30%) saturate(600%) hue-rotate(180deg);
  cursor:pointer;opacity:.9;padding:2px;margin-left:2px;
}
.unit-btn.dt-step{min-width:30px;height:32px;font-size:15px;line-height:1;flex:0 0 auto}
.tw-row input[type=date]::-webkit-calendar-picker-indicator:hover,
.tw-row input[type=time]::-webkit-calendar-picker-indicator:hover{opacity:1}
.tw-time-lbl{font-size:9px;color:#5878a0;white-space:nowrap}
#utc-clock{font-size:11px;color:#7ab4ff;font-weight:600;font-variant-numeric:tabular-nums;margin-top:5px;text-align:left;border-top:1px solid rgba(80,130,255,0.1);padding-top:4px}
#terminator-wrap{min-width:180px;max-width:210px}
/* ── Timezone tooltip (airport time) ── */
#tz-panel{position:absolute;z-index:25;background:rgba(4,8,22,0.97);border:1px solid rgba(80,130,255,0.28);border-radius:8px;padding:6px 10px;pointer-events:none;display:none;min-width:150px;font-size:11px}
.tz-ap{font-size:12px;font-weight:800;color:#a0ccff;letter-spacing:.3px}
.tz-city{font-size:10px;color:#7898b8;margin-bottom:4px}
.tz-time{font-size:14px;font-weight:700;color:#5bffb0;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.tz-date{font-size:9px;color:#5878a0}
.tz-diff{font-size:10px;color:#8898b8;margin-top:3px}
.tz-name{font-size:9px;color:#4868a0;margin-top:2px}
/* ── Time panel in info bar (selected airports) ── */
.leg-tz{display:flex;gap:12px;font-size:10px;color:#5878a0;padding:3px 0 2px 0;justify-content:center;flex-wrap:wrap}
.leg-tz-item{display:flex;flex-direction:column;align-items:center;gap:1px}
.leg-tz-code{font-size:11px;font-weight:700;color:#7ab4ff}
.leg-tz-time{font-size:12px;font-weight:600;color:#5bffb0;font-variant-numeric:tabular-nums}
.leg-tz-diff{font-size:9px;color:#4868a0}
/* ── 月齢パネル ── */
#moon-panel{position:absolute;z-index:10;right:12px;background:rgba(6,10,24,0.88);backdrop-filter:blur(18px);border:1px solid rgba(80,130,255,0.13);border-radius:10px;padding:8px 12px;font-size:11px;color:#8898b8;width:auto}
#moon-panel .mp-title{font-size:12px;font-weight:600;color:#7ab4ff;margin-bottom:8px}
.mp-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;font-size:11px}
.mp-label{color:#5878a0}
.mp-val{color:#c0ccdd;font-weight:500;text-align:right}
#moon-canvas-wrap{text-align:center;margin:5px 0 2px}
#moon-phase-canvas{border-radius:50%;display:inline-block}
.mp-phase-name{text-align:center;font-size:13px;font-weight:600;color:#c8d8f0;margin-bottom:6px}
.mp-next{font-size:10px;color:#4868a0;margin-top:4px;text-align:center}
/* IATA direct input */
#iata-wrap{margin-bottom:7px;display:none}
#iata-wrap .iata-row{display:flex;gap:4px;align-items:center;margin-bottom:4px}
#iata-wrap .iata-slot-lbl{font-size:10px;color:#5878b0;min-width:32px;font-weight:500}
.iata-inp{flex:1;padding:5px 8px;background:rgba(255,255,255,0.05);border:1px solid rgba(80,130,255,0.2);border-radius:6px;color:#a0ccff;font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;outline:none;width:0}
.iata-inp:focus{border-color:rgba(80,160,255,0.55);background:rgba(80,130,255,0.08)}
.iata-inp.ok{border-color:rgba(80,220,120,0.5);color:#80ffb0}
.iata-inp.err{border-color:rgba(255,80,80,0.5);color:#ff8888}
.iata-inp::placeholder{color:rgba(160,180,220,0.3);font-weight:400;letter-spacing:0;text-transform:none;font-size:11px}
#iata-wrap .iata-row{position:relative}
.iata-suggest{position:absolute;top:100%;left:36px;right:0;z-index:40;background:rgba(4,8,22,0.98);border:1px solid rgba(80,130,255,0.35);border-radius:8px;margin-top:2px;max-height:180px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,0.5)}
.iata-suggest-item{padding:6px 10px;font-size:11px;color:#a0ccff;cursor:pointer;display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid rgba(80,130,255,0.08)}
.iata-suggest-item:last-child{border-bottom:none}
.iata-suggest-item:hover,.iata-suggest-item.hl{background:rgba(80,130,255,0.18)}
.iata-suggest-code{font-weight:700;color:#7ab4ff;min-width:34px}
.iata-suggest-city{color:#8898b8;flex:1;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#iata-msg{font-size:10px;color:#5878a0;padding:2px 0}
.input-mode-toggle{display:flex;gap:3px;margin-bottom:6px}
.im-btn{flex:1;padding:4px 0;border-radius:5px;border:1px solid rgba(80,130,255,0.15);background:rgba(80,130,255,0.04);color:#6888b0;cursor:pointer;font-size:10px;font-weight:600;text-align:center;transition:all .15s}
.im-btn.on{background:rgba(80,160,255,0.2);border-color:rgba(80,130,255,0.4);color:#9cc8ff}
.im-btn:hover:not(.on){background:rgba(80,130,255,0.1)}
/* checkboxes */
.chk{display:flex;align-items:center;gap:6px;font-size:11px;color:#8898b8;cursor:pointer;padding:3px 0}
.chk input{accent-color:#5b9aff}
/* info panel */
#info .dv{font-size:20px;font-weight:700;color:#5bffb0;letter-spacing:-.5px}
#info .ds{font-size:12px;color:#5bffb0;opacity:.7}
#info .rt{color:#7898b8;font-size:12px;margin-top:3px}
.leg{display:flex;align-items:center;gap:8px;font-size:12px;color:#8898b8;padding:2px 0;flex-wrap:wrap;justify-content:center}
.ld{color:#5bffb0;font-weight:600;white-space:nowrap}
/* legend items */
.li{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.ln{width:16px;height:2px;border-radius:1px;flex-shrink:0}
/* ===== SLOT UI ===== */
#slots-wrap{margin-bottom:8px;display:none}
#slots-hint{font-size:11px;color:#6898c8;margin-bottom:5px;display:block;font-weight:500}
#slots{display:flex;gap:4px;align-items:stretch}
.slot{flex:1;min-width:0;border-radius:8px;border:1.5px dashed rgba(80,130,255,0.22);background:rgba(80,130,255,0.04);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;position:relative;padding:5px 3px 5px 3px;min-height:62px}
.slot:hover{border-color:rgba(80,160,255,0.5);background:rgba(80,130,255,0.12)}
.slot.active-slot{border-style:solid;border-color:#5b9aff;background:rgba(80,160,255,0.16);box-shadow:0 0 10px rgba(80,160,255,0.22)}
.slot.filled{border-style:solid;border-color:rgba(100,160,255,0.45);background:rgba(80,130,255,0.1)}
.slot.filled:hover{border-color:rgba(255,90,90,0.6);background:rgba(255,60,60,0.08)}
.slot-lbl{font-size:8px;color:#5878b8;line-height:1;margin-bottom:2px;font-weight:600;letter-spacing:0.4px;text-align:center}
.slot-code{font-size:15px;font-weight:800;color:#c0ddff;line-height:1;letter-spacing:0.5px;text-align:center}
.slot-city{font-size:9px;color:#7a9bbc;line-height:1.2;text-align:center;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px;margin-top:2px}
.slot-plus{font-size:18px;color:rgba(80,130,255,0.3);line-height:1}
.slot-x{position:absolute;top:3px;right:3px;font-size:10px;color:rgba(255,90,90,0.5);cursor:pointer;line-height:1;display:none;padding:2px 3px;border-radius:3px;transition:all .1s}
.slot.filled .slot-x{display:block}
.slot-x:hover{color:#ff5555;background:rgba(255,60,60,0.15)}
.ins-btn{width:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;color:rgba(80,160,255,0.25);font-size:12px;border-radius:4px;transition:all .15s;align-self:stretch}
.ins-btn:hover{color:#78b8ff;background:rgba(80,130,255,0.1)}
.ins-btn.hidden{visibility:hidden;pointer-events:none}
.slot-arrow{display:none}

/* ══════════════════════════════════════════════════════
   MOBILE LAYOUT (768px以下)
   PC表示には一切影響しないよう、すべてこのメディアクエリ内で完結させる
   ══════════════════════════════════════════════════════ */
/* モバイル専用要素はPCでは常に非表示 */
#m-topbar,#m-tabbar,#m-backdrop,#m-sheet-head{display:none}

@media (max-width:768px){
  /* ── トップバー ── */
  #m-topbar{
    display:flex;align-items:center;gap:8px;
    position:fixed;top:0;left:0;right:0;height:52px;z-index:60;
    padding:0 10px;background:rgba(6,10,24,0.94);backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(80,130,255,0.16);
    padding-top:env(safe-area-inset-top);height:calc(52px + env(safe-area-inset-top));
  }
  #m-title{flex:1;font-size:14px;font-weight:700;color:#7ab4ff;letter-spacing:.3px}
  .m-btn{
    min-width:44px;height:36px;border:1px solid rgba(80,130,255,0.25);
    border-radius:8px;background:rgba(80,130,255,0.10);color:#a0ccff;
    font-size:14px;cursor:pointer;padding:0 10px;
  }
  .m-btn:active{background:rgba(80,130,255,0.22)}

  /* ── ボトムタブ ── */
  #m-tabbar{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;height:56px;
    background:rgba(6,10,24,0.96);backdrop-filter:blur(18px);
    border-top:1px solid rgba(80,130,255,0.16);
    padding-bottom:env(safe-area-inset-bottom);
    height:calc(56px + env(safe-area-inset-bottom));
  }
  .m-tab{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3px;background:none;border:none;color:#5878a0;font-size:11px;cursor:pointer;
    font-family:inherit;padding:0;
  }
  .m-tab.on{color:#5bffb0}
  .m-tab-i{font-size:17px;line-height:1}
  .m-tab-t{font-size:10px}

  /* ── 背景オーバーレイ ── */
  #m-backdrop{
    display:none;position:fixed;inset:0;z-index:55;
    background:rgba(0,0,0,0.45);
  }
  #m-backdrop.on{display:block}

  /* ── 空港リスト = ボトムシート ── */
  #ctrl{
    top:auto!important;left:0!important;right:0!important;
    bottom:calc(56px + env(safe-area-inset-bottom))!important;
    width:auto!important;max-width:none!important;
    max-height:70vh!important;
    border-radius:16px 16px 0 0!important;
    z-index:58!important;
    transform:translateY(110%);
    transition:transform .26s cubic-bezier(.32,.72,0,1);
    padding:0 12px 12px!important;
  }
  #ctrl.m-open{transform:translateY(0)}

  #m-sheet-head{
    display:flex;align-items:center;position:relative;
    padding:8px 0 6px;margin-bottom:2px;
  }
  .m-grabber{
    width:36px;height:4px;border-radius:2px;
    background:rgba(122,180,255,0.28);margin:0 auto;
  }
  .m-close{
    position:absolute;right:0;top:4px;
    width:32px;height:32px;border:none;background:none;
    color:#5878a0;font-size:15px;cursor:pointer;
  }
  .m-expand{
    position:absolute;left:0;top:4px;
    width:32px;height:32px;border:none;background:none;
    color:#5878a0;font-size:14px;cursor:pointer;
  }
  /* 拡大時: 画面ほぼ全域を使う */
  #ctrl.m-full{
    max-height:calc(100vh - 60px - env(safe-area-inset-top))!important;
    top:calc(56px + env(safe-area-inset-top))!important;
  }

  /* ── 右側パネル群: 中央モーダル化 ── */
  #legend,#terminator-wrap{
    display:none;
    position:fixed!important;
    top:calc(60px + env(safe-area-inset-top))!important;
    left:12px!important;right:12px!important;
    width:auto!important;min-width:0!important;max-width:none!important;
    max-height:calc(100vh - 130px);overflow-y:auto;
    z-index:58!important;
  }
  #legend.m-open,#terminator-wrap.m-open{display:block}

  /* ── 情報パネル: 下部固定・全幅 ── */
  #info{
    left:10px!important;right:10px!important;
    bottom:calc(62px + env(safe-area-inset-bottom))!important;
    min-width:0!important;max-width:none!important;
    z-index:50!important;padding:10px 14px!important;
  }
  #info .dv{font-size:17px}

  /* ── 月齢パネルは凡例内に含まれるため単体では隠す ── */
  #moon-panel{display:none!important}

  /* ── ホバー前提のUIはタッチ環境では無効 ── */
  #tooltip,#tz-panel{display:none!important}

  /* ── タップ領域の拡大(iOS推奨44px) ── */
  .ai{min-height:44px;display:flex;align-items:center}
  .tab{padding:9px 12px;font-size:12px}
  .sb{height:42px;font-size:16px}  /* 16px未満はiOSで自動ズームが起きる */
  .unit-btn{min-height:34px;min-width:42px}
  .slot{min-height:56px}

  /* ── リスト表示領域を最大化 ── */
  /* シートを縦フレックスにして、リストだけが伸縮するようにする */
  #ctrl{display:flex!important;flex-direction:column!important}
  /* max-heightで縛らず、flexで余った領域をすべてリストに与える */
  #al{
    flex:1 1 auto!important;
    min-height:200px;          /* 最低でも4〜5行は見えるようにする */
    max-height:none!important;
    -webkit-overflow-scrolling:touch;
  }
  /* シート内の他要素は縮まないよう固定 */
  #mode-tabs,#region-tabs,.sb,#slots-wrap,#input-mode-toggle,#iata-wrap,#m-sheet-head{
    flex:0 0 auto;
  }

  /* ── 上部の占有スペースを削る ── */
  /* 地域タブは1行に収めて横スクロール(9個が2〜3行に折り返して高さを食うため) */
  #region-tabs{
    flex-wrap:nowrap!important;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    margin-bottom:6px!important;
  }
  #region-tabs::-webkit-scrollbar{display:none}
  #region-tabs .tab{flex:0 0 auto;white-space:nowrap}

  /* 操作ヒント(ドラッグ/ホイール)はタッチ環境では無意味なので隠す */
  #hint-row{display:none!important}
  /* 単位切替はコンパクト化して残す(km/mi/NM切替は使うため) */
  #unit-row{margin-bottom:4px!important;margin-top:0!important}
  #rc-ring{margin-bottom:4px!important}

  /* 余白を詰める */
  #mode-tabs{margin-bottom:6px!important}
  .sb{margin-bottom:6px!important}

  /* ── シートを画面いっぱいまで引き上げられるように ── */
  #ctrl{max-height:82vh!important}

  /* 地球は全画面のまま(キャンバスは元々inset:0) */
}
</style></head><body>
<div id="cv"></div>

<!-- ══ MOBILE UI (768px以下でのみ表示) ══ -->
<div id="m-topbar">
  <button class="m-btn" id="m-menu-btn" onclick="mToggleSheet()" aria-label="空港リストを開く">☰</button>
  <div id="m-title">Airport Globe</div>

/* ── MATH HELPERS ── */
function ll2v(la,lo,r){
  var p=(90-la)*Math.PI/180, t=(lo+180)*Math.PI/180;
  return new THREE.Vector3(-r*Math.sin(p)*Math.cos(t), r*Math.cos(p), r*Math.sin(p)*Math.sin(t));
}
function hav(la1,lo1,la2,lo2){
  var R=Math.PI/180, dLa=(la2-la1)*R, dLo=(lo2-lo1)*R;
  var a=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(la1*R)*Math.cos(la2*R)*Math.sin(dLo/2)*Math.sin(dLo/2);
  return 2*ER*Math.asin(Math.sqrt(a));
}

// ── Security: HTML escape to prevent XSS when inserting user-controlled strings into innerHTML ──
function esc(str){
  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

function mkGlobe(){
  var geo=new THREE.SphereGeometry(GR,96,96);

  // 色定義 (Three.js Color → vec3)
  // NIGHT_COLOR: 既存の色 0x0a1628 → rgb(10,22,40)
  // DAY_COLOR:   0x1a3a5c → rgb(26,58,92) ← 昼側の明るめ色
  var TWILIGHT_WIDTH = 0.309; // sin(18°) 天文薄明

  // ShaderMaterial: cosTheta で昼夜色分け
  sunUniforms = {
    sunDir:         { value: new THREE.Vector3(0,1,0) }, // 初期値(更新される)
    nightColor:     { value: new THREE.Color(0x131e30) },
    dayColor:       { value: new THREE.Color(0x2a6090) },
    twilightWidth:  { value: TWILIGHT_WIDTH },
    opacity:        { value: 0.93 }
  };

  var vertShader = [
    'varying vec3 vWorldNormal;',
    'void main(){',
    '  vWorldNormal = normalize(mat3(modelMatrix) * normal);',
    '  gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);',
    '}'
  ].join('\n');

  var fragShader = [
    'uniform vec3  sunDir;',
    'uniform vec3  nightColor;',
    'uniform vec3  dayColor;',
    'uniform float twilightWidth;',
    'uniform float opacity;',
    'varying vec3  vWorldNormal;',
    '',
    'float smoothstep2(float t){',
    '  t = clamp(t,0.0,1.0);',
    '  return t*t*(3.0-2.0*t);',
    '}',
    '',
    'void main(){',
    '  float cosT = dot(normalize(vWorldNormal), normalize(sunDir));',
    '  vec3 col;',
    '  if(cosT >= 0.0){',
    '    col = dayColor;',         // 昼側: べた塗り
    '  } else if(cosT <= -twilightWidth){',
    '    col = nightColor;',       // 夜側: べた塗り
    '  } else {',
    '    float t = smoothstep2((cosT + twilightWidth) / twilightWidth);',
    '    col = mix(nightColor, dayColor, t);',  // 薄明帯
    '  }',
    '  gl_FragColor = vec4(col, opacity);',
    '}'
  ].join('\n');

  globeMat = new THREE.ShaderMaterial({
    uniforms:       sunUniforms,
    vertexShader:   vertShader,
    fragmentShader: fragShader,
    transparent:    true,
    depthWrite:     true
  });

  window._globeMesh = new THREE.Mesh(geo, globeMat);
  scene.add(window._globeMesh);
  var wMat=new THREE.LineBasicMaterial({color:0x152040,transparent:true,opacity:0.28});
  for(var la=-60;la<=60;la+=30){var p=[];for(var lo=0;lo<=360;lo+=3)p.push(ll2v(la,lo,GR*1.002));scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(p),wMat));}
  for(var lo2=0;lo2<360;lo2+=30){var p2=[];for(var la2=-90;la2<=90;la2+=3)p2.push(ll2v(la2,lo2,GR*1.002));scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(p2),wMat));}
  
}

function mkBorders(){
  borderGrp=new THREE.Group(); scene.add(borderGrp);
  var mat=new THREE.LineBasicMaterial({color:0x7ab0d8,transparent:true,opacity:0.82});
  for(var i=0;i<BD.length;i++){
    var seg=BD[i], pts=[];
    for(var j=0;j<seg.length;j++){
      pts.push(ll2v(seg[j][1],seg[j][0],GR*1.003));
      if(j<seg.length-1){
        var dlo=Math.abs(seg[j+1][0]-seg[j][0]), dla=Math.abs(seg[j+1][1]-seg[j][1]);
        if(dlo>1.5||dla>1.5){
          var steps=Math.ceil(Math.max(dlo,dla)/0.8);
          for(var s=1;s<steps;s++){var t=s/steps;pts.push(ll2v(seg[j][1]+(seg[j+1][1]-seg[j][1])*t,seg[j][0]+(seg[j+1][0]-seg[j][0])*t,GR*1.003));}
        }
      }
    }
    if(pts.length>=2)borderGrp.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),mat));
  }
}

/* ── ARC / RING DRAWING ── */
// Flight profile constants (real-world scale mapped to globe)
// Cruise altitude ~11km, climb/descent ~250km each leg
// GR=5 represents ER=6371km, so scale = GR/ER = 0.000785
var SCALE=GR/ER;           // 3D units per km
var CRUISE_ALT=11;         // km (typical cruise altitude)
var CLIMB_DIST=150;        // km (distance to reach cruise altitude, TOC)
var DESCENT_DIST=200;      // km (distance to start descent, TOD)

// Returns {pts, tocF, todF} where tocF/todF are 0-1 fractions along the arc
function gcArcFull(a1,a2){
  var dist=hav(a1.la,a1.lo,a2.la,a2.lo);
  var seg=Math.max(120,Math.round(dist/25)), pts=[];
  var la1=a1.la*Math.PI/180, lo1=a1.lo*Math.PI/180;
  var la2=a2.la*Math.PI/180, lo2=a2.lo*Math.PI/180;
  var dAng=2*Math.asin(Math.sqrt(Math.pow(Math.sin((la2-la1)/2),2)+Math.cos(la1)*Math.cos(la2)*Math.pow(Math.sin((lo2-lo1)/2),2)));
  if(dAng<0.0001)return {pts:[],tocF:0.1,todF:0.9,dist:dist};

  // TOC and TOD fractions along route
  var climbD=Math.min(CLIMB_DIST, dist*0.35);  // cap for short routes
  var descentD=Math.min(DESCENT_DIST, dist*0.35);
  var tocF=climbD/dist;
  var todF=1.0-(descentD/dist);
  if(tocF>=todF){tocF=0.3;todF=0.7;}  // short routes: shorten phases

  // Surface radius in 3D units
  var R0=GR*1.003;                     // just above surface
  var Rcruise=GR+CRUISE_ALT*SCALE;     // cruise radius (~GR*1.00173)

  for(var i=0;i<=seg;i++){
    var f=i/seg;
    // Great-circle interpolation
    var A=Math.sin((1-f)*dAng)/Math.sin(dAng), B=Math.sin(f*dAng)/Math.sin(dAng);
    var x=A*Math.cos(la1)*Math.cos(lo1)+B*Math.cos(la2)*Math.cos(lo2);
    var y=A*Math.cos(la1)*Math.sin(lo1)+B*Math.cos(la2)*Math.sin(lo2);
    var z=A*Math.sin(la1)+B*Math.sin(la2);
    var la=Math.atan2(z,Math.sqrt(x*x+y*y)), lo=Math.atan2(y,x);

    // Altitude profile: linear climb to TOC, cruise, linear descent to TOD
    var alt;
    if(f<=tocF){
      alt=R0+(Rcruise-R0)*(f/tocF);             // climb
    }else if(f<=todF){
      alt=Rcruise;                                // cruise
    }else{
      alt=Rcruise-(Rcruise-R0)*((f-todF)/(1-todF)); // descent
    }
    pts.push(ll2v(la*180/Math.PI,lo*180/Math.PI,alt));
  }
  return {pts:pts,tocF:tocF,todF:todF,dist:dist,dAng:dAng,la1:la1,lo1:lo1,la2:la2,lo2:lo2};
}

// Get a single point on great circle at fraction f
function gcPoint(arc,f){
  var dAng=arc.dAng,la1=arc.la1,lo1=arc.lo1,la2=arc.la2,lo2=arc.lo2;
  var A=Math.sin((1-f)*dAng)/Math.sin(dAng), B=Math.sin(f*dAng)/Math.sin(dAng);
  var x=A*Math.cos(la1)*Math.cos(lo1)+B*Math.cos(la2)*Math.cos(lo2);
  var y=A*Math.cos(la1)*Math.sin(lo1)+B*Math.cos(la2)*Math.sin(lo2);
  var z=A*Math.sin(la1)+B*Math.sin(la2);
  var la=Math.atan2(z,Math.sqrt(x*x+y*y)), lo=Math.atan2(y,x);
  return ll2v(la*180/Math.PI,lo*180/Math.PI,GR+CRUISE_ALT*SCALE);
}

function makeTube(pts,color,radius,opacity){
  if(pts.length<2)return null;
  var curve=new THREE.CatmullRomCurve3(pts);
  var geo=new THREE.TubeGeometry(curve,Math.max(pts.length*2,20),radius,6,false);
  return new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:color,transparent:true,opacity:opacity,depthWrite:false}));
}

function addArc(a1,a2,color,showProfile){
  var arc=gcArcFull(a1,a2);
  if(arc.pts.length<2)return;

  if(!showProfile){
    var flat=[];
    var la1=a1.la*Math.PI/180,lo1=a1.lo*Math.PI/180,la2=a2.la*Math.PI/180,lo2=a2.lo*Math.PI/180;
    var dAng=arc.dAng,seg=Math.max(60,Math.round(arc.dist/60));
    for(var i=0;i<=seg;i++){
      var f=i/seg;
      var A=Math.sin((1-f)*dAng)/Math.sin(dAng),B=Math.sin(f*dAng)/Math.sin(dAng);
      var x=A*Math.cos(la1)*Math.cos(lo1)+B*Math.cos(la2)*Math.cos(lo2);
      var y=A*Math.cos(la1)*Math.sin(lo1)+B*Math.cos(la2)*Math.sin(lo2);
      var z=A*Math.sin(la1)+B*Math.sin(la2);
      var la=Math.atan2(z,Math.sqrt(x*x+y*y)),lo=Math.atan2(y,x);
      flat.push(ll2v(la*180/Math.PI,lo*180/Math.PI,GR*1.004));
    }
    var m=makeTube(flat,color,0.012,0.70);
    if(m)arcGrp.add(m);
    return;
  }

  var tocIdx=Math.round(arc.tocF*(arc.pts.length-1));
  var todIdx=Math.round(arc.todF*(arc.pts.length-1));
  var R=0.015;
  var m1=makeTube(arc.pts.slice(0,tocIdx+1),0x88ff44,R,0.95);
  var m2=makeTube(arc.pts.slice(tocIdx,todIdx+1),0x44ddff,R,0.95);
  var m3=makeTube(arc.pts.slice(todIdx),0xff8844,R,0.95);
  if(m1)arcGrp.add(m1);
  if(m2)arcGrp.add(m2);
  if(m3)arcGrp.add(m3);
  arcGrp.userData.lastArc=arc;
}


function clearArcs(){
  while(arcGrp.children.length){
    var obj=arcGrp.children[0];
    if(obj.geometry)obj.geometry.dispose();
    if(obj.material){if(obj.material.map)obj.material.map.dispose();obj.material.dispose();}
    arcGrp.remove(obj);
  }
}
function clearRings(){
  while(ringGrp.children.length){
    var obj=ringGrp.children[0];
    if(obj.geometry)obj.geometry.dispose();
    if(obj.material){if(obj.material.map)obj.material.map.dispose();obj.material.dispose();}
    ringGrp.remove(obj);
  }
}

function mkRings(ap){
  clearRings();
  var _slVal=parseInt(document.getElementById("md").value);
  var mx=sliderValToKm(_slVal); // 表示単位 → km
  mx=Math.min(mx, Math.PI*ER); // 地球半周(対蹠点)を超えないようクランプ

  // Build a canvas-based sprite for ring distance labels
  function makeLabel(text, opacity){
    var size=256, cv2=document.createElement("canvas");
    cv2.width=size; cv2.height=64;
    var ctx=cv2.getContext("2d");
    ctx.clearRect(0,0,size,64);
    // background pill
    ctx.fillStyle="rgba(8,14,32,0.72)";
    var tw=ctx.measureText(text).width; // measure before setting font
    ctx.font="bold 32px 'Segoe UI',Arial,sans-serif";
    tw=ctx.measureText(text).width;
    var pad=16, ph=44, pw=tw+pad*2;
    var x0=(size-pw)/2;
    ctx.beginPath();
    ctx.roundRect(x0,10,pw,ph,8);
    ctx.fill();
    // text
    ctx.fillStyle="rgba(100,255,200,"+opacity.toFixed(2)+")";
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText(text,size/2,32);
    var tex=new THREE.CanvasTexture(cv2);
    var mat=new THREE.SpriteMaterial({map:tex,transparent:true,opacity:opacity,depthTest:false});
    var sp=new THREE.Sprite(mat);
    sp.scale.set(0.5,0.125,1);
    return sp;
  }

  // Bearing offset for label placement (slightly above "north" of ring = bearing 0)
  // We place labels at bearing=0 (due north from origin airport), and also at 180 for large rings
  var LABEL_BEARINGS=[0, Math.PI]; // north and south

  // 等距離線間隔: km=1000, mi=500, nm=500 (補助線なし)
  var majorKm;
  if(unitMode==="mi"){
    majorKm=500*1.60934;  // 500 mi in km
  }else if(unitMode==="nm"){
    majorKm=500*1.852;    // 500 nm in km
  }else{
    majorKm=1000;
  }

  // 主要線のみ描画（補助線廃止）: km=1000, mi=500, nm=500
  var d=majorKm;
  while(d<=mx+majorKm*0.01){
    var ang=d/ER, pts=[], seg=240;
    var la1=ap.la*Math.PI/180, lo1=ap.lo*Math.PI/180;
    for(var i=0;i<=seg;i++){
      var b=(i/seg)*2*Math.PI;
      var la2=Math.asin(Math.sin(la1)*Math.cos(ang)+Math.cos(la1)*Math.sin(ang)*Math.cos(b));
      var lo2=lo1+Math.atan2(Math.sin(b)*Math.sin(ang)*Math.cos(la1),Math.cos(ang)-Math.sin(la1)*Math.sin(la2));
      pts.push(ll2v(la2*180/Math.PI,lo2*180/Math.PI,GR*1.005));
    }
    var op=Math.max(0.25,0.75-(d/mx)*0.52);
    ringGrp.add(new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(pts),
      new THREE.LineBasicMaterial({color:0x5affb0,transparent:true,opacity:op})
    ));

    // ラベル
    var labelText=ringVal(d)+" "+ringUnit();
    var labelOp=Math.max(0.45,0.92-(d/mx)*0.48);
    var bearings=[0];
    if(d>=majorKm*3) bearings=[0,Math.PI];
    for(var bi=0;bi<bearings.length;bi++){
      var bear=bearings[bi];
      var la2l=Math.asin(Math.sin(la1)*Math.cos(ang)+Math.cos(la1)*Math.sin(ang)*Math.cos(bear));
      var lo2l=lo1+Math.atan2(Math.sin(bear)*Math.sin(ang)*Math.cos(la1),Math.cos(ang)-Math.sin(la1)*Math.sin(la2l));
      var sp=makeLabel(labelText,labelOp);
      var pos=ll2v(la2l*180/Math.PI,lo2l*180/Math.PI,GR*1.022);
      sp.position.copy(pos);
      ringGrp.add(sp);
    }

    d+=majorKm;
  }

  // Update slider display
  document.getElementById("mdv").textContent=sliderLabel(_slVal);
}


/* ── SLOT SYSTEM ── */
function getValid(){return selAP.filter(function(a){return a;});}

function rebuildSlots(){
  var el=document.getElementById("slots");
  el.innerHTML="";
  var valid=getValid();

  for(var i=0;i<MAX_SLOTS;i++){
    // insert button between slots
    if(i>0){
      var ins=document.createElement("div");
      ins.className="ins-btn"+(valid.length<2||i>valid.length?" hidden":"");
      ins.textContent="+";
      ins.title=t("insert_via_title");
      (function(ii){ins.addEventListener("click",function(){insertAt(ii);});})(i);
      el.appendChild(ins);
    }

    var slot=document.createElement("div");
    var ap=selAP[i]||null;
    var cls="slot";
    if(ap) cls+=" filled";
    else if(i===activeSlot) cls+=" active-slot";
    slot.className=cls;

    var lbl=document.createElement("div");
    lbl.className="slot-lbl";
    // 未選択スロットにはラベルを表示しない(選択済みのみ表記)
    lbl.textContent = ap ? dynSlotLabel(i) : "";
    slot.appendChild(lbl);

    if(ap){
      var codeEl=document.createElement("div");
      codeEl.className="slot-code";
      codeEl.textContent=ap.c;
      slot.appendChild(codeEl);

      var city=document.createElement("div");
      city.className="slot-city";
      city.textContent=apCity(ap);
      slot.appendChild(city);

      var xb=document.createElement("div");
      xb.className="slot-x";
      xb.textContent="x";
      xb.title=t("release_title");
      (function(ii){xb.addEventListener("click",function(e){e.stopPropagation();removeSlot(ii);});})(i);
      slot.appendChild(xb);

      slot.title=ap.c+": "+apName(ap)+" ("+cN(ap.co)+") / "+t("slot_click_release");
      (function(a){slot.addEventListener("click",function(e){
        if(e.target.className==="slot-x")return;
        focusOn(a);
      });})(ap);
    }else{
      var ico=document.createElement("div");
      ico.className="slot-plus";
      ico.textContent="+";
      slot.appendChild(ico);

      slot.title=t("slot_click_select");
      (function(ii){slot.addEventListener("click",function(){
        activeSlot=ii; rebuildSlots(); updHint();
      });})(i);
    }
    el.appendChild(slot);
  }
  updHint();
  if(inputMode==="iata") buildIataRows();
}


function updHint(){
  var hint=document.getElementById("slots-hint");
  var valid=getValid();
  if(valid.length===0){hint.textContent=t("slot_hint_select");return;}
  if(activeSlot<MAX_SLOTS&&!selAP[activeSlot]){hint.textContent=dynSlotLabel(activeSlot)+" "+t("slot_hint_select");return;}
  if(valid.length>=MAX_SLOTS){hint.textContent=t("slot_hint_full");return;}
  hint.textContent=t("slot_hint_empty");
}

function removeSlot(i){
  selAP.splice(i,1);
  selAP=selAP.filter(function(a){return a;});
  if(activeSlot>selAP.length)activeSlot=selAP.length;
  clearPinTT();
  rebuildSlots(); redraw(); updInfo(); updColors(); renderList();
}

function insertAt(i){
  var valid=getValid();
  if(valid.length>=MAX_SLOTS)return;
  selAP=selAP.filter(function(a){return a;});
  selAP.splice(i,0,null);
  activeSlot=i;
  rebuildSlots(); updHint(); renderList();
}

function focusOn(ap){
  autoRot=false;
  // Rotate globe so the airport faces the camera (camera is at +Z)
  var target=ll2v(ap.la,ap.lo,GR).normalize();
  var camDir=new THREE.Vector3(0,0,1);
  // We need to rotate globeQ so that globeQ.apply(target) == camDir
  // i.e. find q such that q * target = camDir
  var current=target.clone().applyQuaternion(globeQ);
  var needed=new THREE.Quaternion().setFromUnitVectors(current,camDir);
  tGlobeQ=needed.multiply(globeQ.clone());
  globeAnimating=true;
}
var tGlobeQ=new THREE.Quaternion();
var globeAnimating=false;

function addToSlot(ap){
  // remove if already in another slot
  var ex=selAP.indexOf(ap);
  if(ex===-1){for(var i=0;i<selAP.length;i++){if(selAP[i]&&selAP[i].c===ap.c){ex=i;break;}}}
  if(ex!==-1&&ex===activeSlot){return;} // same slot - no-op
  if(ex!==-1)selAP[ex]=null;

  // ensure array long enough
  while(selAP.length<=activeSlot)selAP.push(null);
  selAP[activeSlot]=ap;

  // compact and advance
  var compacted=selAP.filter(function(a){return a;});
  selAP=compacted;
  // find next empty slot
  var next=activeSlot+1;
  while(next<MAX_SLOTS&&selAP[next])next++;
  activeSlot=(next<MAX_SLOTS)?next:selAP.length;
  if(activeSlot>MAX_SLOTS-1)activeSlot=MAX_SLOTS-1;
}

// updColors sets color and stores baseScale in userData.

    }
  }
}

var inputMode = "list"; // "list" | "iata"

function setInputMode(m, el){
  inputMode = m;

function buildIataRows(){
  var wrap = document.getElementById("iata-rows");
  wrap.innerHTML = "";
  var count = (mode === "ring") ? 1 : MAX_SLOTS;
  for(var i = 0; i < count; i++){
    var row = document.createElement("div");
    row.className = "iata-row";

    var lbl = document.createElement("div");
    lbl.className = "iata-slot-lbl";
    lbl.textContent = (mode === "ring") ? t("legend_airport") : dynSlotLabel(i);
    row.appendChild(lbl);

    var inp = document.createElement("input");
    inp.className = "iata-inp";
    inp.type = "text";
    inp.maxLength = 3;
    inp.placeholder = t("iata_placeholder");
    inp.autocomplete = "off";
    inp.dataset.slot = i;
    // pre-fill if already selected
    if(selAP[i]) { inp.value = selAP[i].c; inp.className = "iata-inp ok"; }

    // サジェストドロップダウン
    var suggest = document.createElement("div");
    suggest.className = "iata-suggest";
    suggest.style.display = "none";

    function hideSuggest(){ suggest.style.display = "none"; suggest.innerHTML=""; }

    function showSuggest(prefix, input, slotIdx){
      var matches = [];
      for(var j=0;j<AP.length && matches.length<8;j++){
        if(AP[j].c.indexOf(prefix)===0) matches.push(AP[j]);
      }
      if(matches.length===0){ hideSuggest(); return; }
      suggest.innerHTML = "";
      matches.forEach(function(m){
        var item = document.createElement("div");
        item.className = "iata-suggest-item";
        var codeEl = document.createElement("span");
        codeEl.className = "iata-suggest-code";
        codeEl.textContent = m.c;
        var cityEl = document.createElement("span");
        cityEl.className = "iata-suggest-city";
        cityEl.textContent = apCity(m);
        item.appendChild(codeEl); item.appendChild(cityEl);
        item.addEventListener("mousedown", function(e){
          e.preventDefault(); // input の blur より先に発火させる
          input.value = m.c;
          input.className = "iata-inp ok";
          document.getElementById("iata-msg").textContent = m.c+": "+apName(m)+" ("+cN(m.co)+")";
          _selectByAP(m, slotIdx);
          hideSuggest();
        });
        suggest.appendChild(item);
      });
      suggest.style.display = "block";
    }

    (function(input, slotIdx, suggestEl, showFn, hideFn){
      input.addEventListener("input", function(){
        var v = input.value.toUpperCase().replace(/[^A-Z]/g,"");
        input.value = v;
        if(v.length === 0){ input.className = "iata-inp"; hideFn(); return; }
        if(v.length < 3){
          input.className = "iata-inp";
          showFn(v, input, slotIdx);
          return;
        }
        // find airport (完全一致)
        var found = null;
        for(var j=0;j<AP.length;j++){if(AP[j].c===v){found=AP[j];break;}}
        if(found){
          input.className = "iata-inp ok";
          document.getElementById("iata-msg").textContent = found.c+": "+apName(found)+" ("+cN(found.co)+")";
          _selectByAP(found, slotIdx);
          hideFn();
        } else {
          input.className = "iata-inp err";
          document.getElementById("iata-msg").textContent = v+": "+t("iata_unknown");
          hideFn();
        }
      });
      input.addEventListener("focus", function(){
        var v = input.value;
        if(v.length>=1 && v.length<3) showFn(v, input, slotIdx);
      });
      input.addEventListener("blur", function(){
        setTimeout(hideFn, 150); // クリック選択を許すための遅延
      });
      input.addEventListener("keydown", function(e){
        if(e.key==="Escape"){ hideFn(); return; }
        if(e.key==="Tab"||e.key==="Enter"){
          e.preventDefault();
          hideFn();
          // move focus to next input
          var rows = document.querySelectorAll(".iata-inp");
          var idx2 = Array.from(rows).indexOf(input);
          if(idx2 < rows.length-1) rows[idx2+1].focus();
        }
      });
    })(inp, i, suggest, showSuggest, hideSuggest);

    row.appendChild(inp);
    row.appendChild(suggest);

    // clear button
    var clr = document.createElement("div");
    clr.textContent = "×";
    clr.style.cssText = "cursor:pointer;color:rgba(255,90,90,0.5);font-size:14px;padding:2px 4px;transition:color .1s";
    clr.onmouseenter = function(){this.style.color="#ff5555";};
    clr.onmouseleave = function(){this.style.color="rgba(255,90,90,0.5)";};
    (function(input, slotIdx){
      clr.addEventListener("click", function(){
        input.value = ""; input.className = "iata-inp";
        document.getElementById("iata-msg").textContent = "";
        removeSlot(slotIdx);
      });
    })(inp, i);
    row.appendChild(clr);

    wrap.appendChild(row);
  }
}

// Select airport directly into a specific slot (used by IATA input mode)
function _selectByAP(ap, slotIdx){
  // remove if already in another slot
  var ex = -1;
  for(var i=0;i<selAP.length;i++){if(selAP[i]&&selAP[i].c===ap.c&&i!==slotIdx){ex=i;break;}}
  if(ex!==-1){ selAP[ex]=null; }

  while(selAP.length <= slotIdx) selAP.push(null);
  selAP[slotIdx] = ap;
  selAP = selAP.filter(function(a,i){ return a||i<slotIdx; }); // compact trailing nulls after slotIdx
  // Recompute: keep non-null, but preserve order
  var rebuilt = [];
  for(var i=0;i<Math.max(selAP.length,slotIdx+1);i++) rebuilt.push(selAP[i]||null);
  // compact: only keep non-null entries
  selAP = rebuilt;

  redraw(); updColors(); updInfo();
  rebuildSlots();
  // update ring if needed
  if(mode==="ring" && selAP[0]) mkRings(selAP[0]);
  focusOn(ap);
}

/* ── SELECT AIRPORT ── */
function selectAP(idx){
  var ap=AP[idx]; if(!ap)return;
  autoRot=false;

  if(mode==="ring"){
    selAP=[ap]; activeSlot=0;

    clearRings(); clearArcs();
    mkRings(ap); updColors(); updInfo(); renderList();
    focusOn(ap); return;
  }

  // toggle: clicking selected airport removes it
  var ex=-1;
  for(var i=0;i<selAP.length;i++){if(selAP[i]&&selAP[i].c===ap.c){ex=i;break;}}
  if(ex!==-1){
    // remove from slot
    selAP.splice(ex,1);
    selAP=selAP.filter(function(a){return a;});
    if(activeSlot>selAP.length)activeSlot=selAP.length;
    rebuildSlots();
    redraw(); updColors(); updInfo(); renderList();
    return;
  }

  // add
  {
    // distance: simple push up to MAX_SLOTS
    if(selAP.length>=MAX_SLOTS){selAP=[];activeSlot=0;}
    selAP.push(ap);
    rebuildSlots();
  }
  redraw(); updColors(); updInfo(); renderList();
  mAutoCloseOnSelect();   // スマホ: 選択したらシートを閉じて地球を見せる
  // Pin tooltip after selection so slot area doesn't obscure info
  if(mode==="distance"){
    pinTT(ap);
  }else{
    clearPinTT();
    focusOn(ap);
    return;
  }
  focusOn(ap);
}

/* ── EVENTS ── */
function setupEvents(){
  var cv=ren.domElement;

  // ─── Google Earth drag ───────────────────────────────────────────────────
  // Strategy: on mousedown, record the globe-local unit vector under the cursor.
  //           On mousemove, find the current globe-local vector under the cursor
  //           and compute the quaternion that rotates the start vector to the
  //           current vector, then apply that delta on top of the start orientation.
  //           This makes the grabbed point "stick" to the cursor.
  //
  //  Coordinate spaces:
  //    World  = Three.js world (camera at +Z, globe mesh centered at origin)
  //    Local  = Globe-local (undoes globeQ rotation)

  var dragStartLocal = null;   // unit vec in globe-local space at drag start
  var dragStartQ     = null;   // globeQ snapshot at drag start

  // Velocity history ring buffer for smooth inertia
  var VEL_BUF = 6;
  var vBuf = [];               // [{dx,dy,dt}]
  var dragT = 0;               // timestamp of last mousemove

  function screenRayGlobe(nx, ny) {
    // Returns the world-space point where the view ray hits the globe,
    // or null if it misses.
    var r = new THREE.Raycaster();
    r.setFromCamera(new THREE.Vector2(nx, ny), cam);
    var hit = new THREE.Vector3();
    return r.ray.intersectSphere(new THREE.Sphere(new THREE.Vector3(), GR), hit)
           ? hit : null;
  }

  function worldToLocal(wpt) {
    // Globe-local = world point rotated by inverse of globeQ
    return wpt.clone().applyQuaternion(globeQ.clone().conjugate());
  }

  cv.addEventListener('mousedown', function(e) {
    if (e.button !== 0) return;
    isDrag = true; wasDrag = false; autoRot = false;
    prevMx = e.clientX; prevMy = e.clientY;
    velTheta = 0; velPhi = 0; vBuf = [];

    var nx = (e.clientX / innerWidth)  * 2 - 1;
    var ny = -(e.clientY / innerHeight) * 2 + 1;
    var hit = screenRayGlobe(nx, ny);
    if (hit) {
      dragStartLocal = worldToLocal(hit).normalize();
      dragStartQ = globeQ.clone();
    } else {
      dragStartLocal = null;
    }
  });

  cv.addEventListener('mousemove', function(e) {
    curMx = e.clientX; curMy = e.clientY;
    mouse.x = (e.clientX / innerWidth)  * 2 - 1;
    mouse.y = -(e.clientY / innerHeight) * 2 + 1;

    if (!isDrag) return;

    var dx = e.clientX - prevMx;
    var dy = e.clientY - prevMy;
    if (dx*dx + dy*dy > 2) wasDrag = true;

    if (dragStartLocal && dragStartQ) {
      // Find current globe-local vector under cursor
      var hit = screenRayGlobe(mouse.x, mouse.y);
      if (hit) {
        // The local position is computed using the *original* orientation,
        // so the rotation always references the drag-start frame.
        var curLocal = hit.clone().applyQuaternion(dragStartQ.clone().conjugate()).normalize();

        // Rotate dragStartLocal onto curLocal so grabbed point follows cursor
        var delta = new THREE.Quaternion().setFromUnitVectors(
          dragStartLocal,
          curLocal
        );
        globeQ = dragStartQ.clone().multiply(delta);
        tGlobeQ.copy(globeQ);
        globeAnimating = false;
      }
    }

    // Velocity buffer for inertia
    var now = performance.now();
    vBuf.push({dx: dx, dy: dy, dt: now - dragT});
    if (vBuf.length > VEL_BUF) vBuf.shift();
    dragT = now;

    prevMx = e.clientX; prevMy = e.clientY;
  });

  cv.addEventListener('mouseup', function() {
    isDrag = false;
    // Compute average velocity from recent buffer
    if (vBuf.length > 0) {
      var sdx = 0, sdy = 0, sdt = 0;
      for (var i = 0; i < vBuf.length; i++) { sdx += vBuf[i].dx; sdy += vBuf[i].dy; sdt += vBuf[i].dt; }
      var avgDt = Math.max(1, sdt / vBuf.length);
      // Angular velocity: pixels → radians, scaled by zoom
      var px2rad = (Math.PI / innerHeight) * (camR / GR) * 0.6;
      velTheta = (sdx / vBuf.length) / avgDt * 16 * px2rad;
      velPhi   = (sdy / vBuf.length) / avgDt * 16 * px2rad;
    }
  });

  cv.addEventListener('mouseleave', function() {
    isDrag = false; showTT(null); velTheta = 0; velPhi = 0;
  });

  cv.addEventListener('click', function(e) {
    if (wasDrag) return;
    var nx = (e.clientX / innerWidth)  * 2 - 1;
    var ny = -(e.clientY / innerHeight) * 2 + 1;
    raycaster.setFromCamera(new THREE.Vector2(nx, ny), cam);
    var hits = raycaster.intersectObjects(apMeshes);
    if (hits.length > 0) selectAP(hits[0].object.userData.idx);
  });

  // ─── Wheel zoom ─────────────────────────────────────────────────────────
  // Use small additive steps so fine control is easy near the globe.
  cv.addEventListener('wheel', function(e) {
    e.preventDefault();
    autoRot = false;
    // Clamp deltaY: trackpads fire many tiny events, mice fire large ones
    var delta = Math.sign(e.deltaY) * Math.min(Math.abs(e.deltaY), 100);
    // Step: 2% of current radius per 100px of scroll
    var step = tCamR * 0.08 * (delta / 100);
    tCamR = Math.max(6.5, Math.min(35, tCamR + step));
  }, {passive: false});

  // ─── Touch ──────────────────────────────────────────────────────────────
  var touchStartLocal = null, touchStartQ2 = null;
  var pinchD0 = 0, pinchR0 = 14;

  cv.addEventListener('touchstart', function(e) {
    if (e.touches.length === 1) {
      isDrag = true; wasDrag = false; autoRot = false; velTheta = 0; velPhi = 0; vBuf = [];
      prevMx = e.touches[0].clientX; prevMy = e.touches[0].clientY; dragT = performance.now();
      var nx = (prevMx / innerWidth)  * 2 - 1;
      var ny = -(prevMy / innerHeight) * 2 + 1;
      var hit = screenRayGlobe(nx, ny);
      touchStartLocal = hit ? worldToLocal(hit).normalize() : null;
      touchStartQ2 = globeQ.clone();
      pinching = false;
    } else if (e.touches.length === 2) {
      isDrag = false; pinching = true;
      var ddx = e.touches[0].clientX - e.touches[1].clientX;
      var ddy = e.touches[0].clientY - e.touches[1].clientY;
      pinchD0 = Math.sqrt(ddx*ddx + ddy*ddy); pinchR0 = tCamR;
    }
  }, {passive: true});

  cv.addEventListener('touchmove', function(e) {
    e.preventDefault();
    if (pinching && e.touches.length === 2) {
      var ddx = e.touches[0].clientX - e.touches[1].clientX;
      var ddy = e.touches[0].clientY - e.touches[1].clientY;
      var d = Math.sqrt(ddx*ddx + ddy*ddy);
      tCamR = Math.max(6.5, Math.min(35, pinchR0 * (pinchD0 / d)));
      return;
    }
    if (!isDrag || e.touches.length !== 1) return;
    var tx = e.touches[0].clientX, ty = e.touches[0].clientY;
    var dx = tx - prevMx, dy = ty - prevMy;
    if (dx*dx + dy*dy > 2) wasDrag = true;
    var nx = (tx / innerWidth)  * 2 - 1;
    var ny = -(ty / innerHeight) * 2 + 1;
    if (touchStartLocal && touchStartQ2) {
      var hit = screenRayGlobe(nx, ny);
      if (hit) {
        var curLocal = hit.clone().applyQuaternion(touchStartQ2.clone().conjugate()).normalize();
        var delta = new THREE.Quaternion().setFromUnitVectors(touchStartLocal, curLocal);
        globeQ = touchStartQ2.clone().multiply(delta);
        tGlobeQ.copy(globeQ);
        globeAnimating = false;
      }
    }
    var now = performance.now();
    vBuf.push({dx: dx, dy: dy, dt: now - dragT});
    if (vBuf.length > VEL_BUF) vBuf.shift();
    dragT = now;
    prevMx = tx; prevMy = ty;
  }, {passive: false});

  cv.addEventListener('touchend', function(e) {
    pinching = false;
    if (!wasDrag && e.changedTouches.length === 1) {
      var t = e.changedTouches[0];
      var nx = (t.clientX / innerWidth)  * 2 - 1;
      var ny = -(t.clientY / innerHeight) * 2 + 1;
      raycaster.setFromCamera(new THREE.Vector2(nx, ny), cam);
      var hits = raycaster.intersectObjects(apMeshes);
      if (hits.length > 0) selectAP(hits[0].object.userData.idx);
    }
    isDrag = false;
    if (vBuf.length > 0) {
      var sdx = 0, sdy = 0, sdt = 0;
      for (var i = 0; i < vBuf.length; i++) { sdx += vBuf[i].dx; sdy += vBuf[i].dy; sdt += vBuf[i].dt; }
      var avgDt = Math.max(1, sdt / vBuf.length);
      var px2rad = (Math.PI / innerHeight) * (camR / GR) * 0.6;
      velTheta = (sdx / vBuf.length) / avgDt * 16 * px2rad;
      velPhi   = (sdy / vBuf.length) / avgDt * 16 * px2rad;
    }
  });

  addEventListener('resize', function() {
    cam.aspect = innerWidth / innerHeight;
    cam.updateProjectionMatrix();
    ren.setSize(innerWidth, innerHeight);
  });
}

/* ── ANIMATE ── */
// 毎フレーム再利用する一時オブジェクト（GCプレッシャー軽減）
var _tmpQ1 = new THREE.Quaternion();
var _tmpQ2 = new THREE.Quaternion();
var _tmpQ3 = new THREE.Quaternion();
var _tmpV1 = new THREE.Vector3();
var _tmpV2 = new THREE.Vector3();
var _tmpV3 = new THREE.Vector3();
var _lastDotScale = -1; // dotScaleが変化した時のみ更新

function animate(){
  requestAnimationFrame(animate);

  // Auto-rotate
  if (autoRot) {
    _tmpQ1.setFromAxisAngle(_tmpV1.set(0,1,0), 0.0008);
    globeQ.premultiply(_tmpQ1);
    tGlobeQ.copy(globeQ);
  }

  // Inertia: rotate globe along camera-right (for horizontal drag)
  //          and camera-up cross camera-forward (for vertical drag)
  // In our setup camera faces -Z in world space (lookAt origin from +Z).
  // Camera right = +X, camera up = +Y in world space (no roll).
  // Horizontal drag  → rotate globe around world Y axis
  // Vertical drag    → rotate globe around world X axis
  if (!isDrag && (Math.abs(velTheta) > 0.00005 || Math.abs(velPhi) > 0.00005)) {
    _tmpQ1.setFromAxisAngle(_tmpV1.set(0,1,0), velTheta);
    _tmpQ2.setFromAxisAngle(_tmpV2.set(1,0,0), velPhi);
    globeQ.premultiply(_tmpQ1.multiply(_tmpQ2));
    tGlobeQ.copy(globeQ);
    velTheta *= 0.90;
    velPhi   *= 0.90;
    if (Math.abs(velTheta) < 0.00005) velTheta = 0;
    if (Math.abs(velPhi)   < 0.00005) velPhi   = 0;
  }

  // Smooth focus animation (slerp)
  if (globeAnimating) {
    globeQ.slerp(tGlobeQ, 0.09);
    if (globeQ.angleTo(tGlobeQ) < 0.001) { globeQ.copy(tGlobeQ); globeAnimating = false; }
  }

  // Smooth zoom
  camR += (tCamR - camR) * 0.12;

  // Zoom compensation for dot size: only update when scale changes
  var dotScale = Math.min(1.0, Math.max(0.35, camR / 14.0));
  if(Math.abs(dotScale - _lastDotScale) > 0.001){
    _lastDotScale = dotScale;
    for(var _di=0;_di<apMeshes.length;_di++){
      var _m=apMeshes[_di];
      var _bs=(_m.userData.baseScale!==undefined)?_m.userData.baseScale:1.0;
      _m.scale.setScalar(_bs*dotScale);
    }
  }

  // Apply globe rotation to all scene objects
  scene.children.forEach(function(obj) {
    if (obj === cam) return;
    obj.quaternion.copy(globeQ);
  });

  // Camera fixed at +Z
  cam.position.set(0, 0, camR);
  cam.lookAt(0, 0, 0);

  // ── Hover / tooltip ──────────────────────────────────────────
  mouse.x = (curMx / innerWidth)  * 2 - 1;
  mouse.y = -(curMy / innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, cam);
  var hits = raycaster.intersectObjects(apMeshes);

  // Reset previous hover scale
  if (hovM) {
    var hi = -1;
    for (var i = 0; i < selAP.length; i++) {
      if (selAP[i] && selAP[i].c === hovM.userData.ap.c) { hi = i; break; }
    }
    if (hi === -1) {
      // Restore original baseScale when no longer hovered
      if(hovM.userData.savedBaseScale!==undefined){
        hovM.userData.baseScale=hovM.userData.savedBaseScale;
        delete hovM.userData.savedBaseScale;
      }
    }
    hovM = null;
  }

  if (hits.length > 0) {
    hovM = hits[0].object;
    var hi2 = -1;
    for (var i = 0; i < selAP.length; i++) {
      if (selAP[i] && selAP[i].c === hovM.userData.ap.c) { hi2 = i; break; }
    }
    // Hover highlight: save original and boost
    if (hi2 === -1) {
      if(hovM.userData.savedBaseScale===undefined) hovM.userData.savedBaseScale=hovM.userData.baseScale||1.0;
      hovM.userData.baseScale=1.6;
    }
    ren.domElement.style.cursor = 'pointer';
    showTT(hovM.userData.ap, curMx, curMy, false);
  } else {
    ren.domElement.style.cursor = isDrag ? 'grabbing' : 'grab';
    if (pinnedTT) showTT(pinnedTT.ap, pinnedTT.x, pinnedTT.y, true);
    else showTT(null);
  }

  // Update terminator and clock periodically
  if(terminatorOn && typeof _lastTermUpdate==="undefined") window._lastTermUpdate=0;
  if(terminatorOn && realtimeMode){
    var _now2=Date.now();
    if(_now2-window._lastTermUpdate>10000){ buildTerminator(); window._lastTermUpdate=_now2; }
  }
  // Apply terminator group rotation with globe
  if(terminatorGroup) terminatorGroup.quaternion.copy(globeQ);

  // シェーダー: 毎フレーム太陽方向をワールド座標に変換して更新
  if(terminatorOn && sunUniforms && terminatorGroup && terminatorGroup.userData.sunX !== undefined){
    _tmpV3.set(
      terminatorGroup.userData.sunX,
      terminatorGroup.userData.sunY,
      terminatorGroup.userData.sunZ
    ).applyQuaternion(globeQ);
    sunUniforms.sunDir.value.copy(_tmpV3);
  }

  // 太陽マーカー: 地球の裏側に回ったら早めに非表示（透け防止）
  if(terminatorGroup && terminatorGroup.userData.sunSprite && terminatorGroup.userData.sunLocalPos){
    _tmpV2.copy(terminatorGroup.userData.sunLocalPos).applyQuaternion(globeQ);
    // カメラは+Z側に固定 → ワールドZが margin 以下なら裏側とみなし隠す
    var _sunVisMargin = GR * 0.06;
    terminatorGroup.userData.sunSprite.visible = (_tmpV2.z > _sunVisMargin);
  }

  ren.render(scene, cam);
}


/* ═══════════════════════════════════════════════════
   TIMEZONE HELPERS
═══════════════════════════════════════════════════ */
function apTZ(code){ return TZ_MAP[code] || "UTC"; }

function apLocalTime(code, date){
  var tz = apTZ(code);
  try {
    return new Intl.DateTimeFormat("ja-JP", {
      timeZone: tz,
      hour:"2-digit", minute:"2-digit", second:"2-digit",
      hour12: false
    }).format(date);
  } catch(e){ return "??:??:??"; }
}

function apLocalDate(code, date){
  var tz = apTZ(code);
  try {
    return new Intl.DateTimeFormat("ja-JP", {
      timeZone: tz,
      month:"2-digit", day:"2-digit", weekday:"short"
    }).format(date);
  } catch(e){ return ""; }
}

function tzOffsetHours(tzName, date){
  // Get UTC offset in hours for given timezone at given date
  try {
    var utcStr = new Intl.DateTimeFormat("en-US", {
      timeZone: "UTC", hour:"numeric", hour12:false, timeZoneName:"short"
    }).format(date);
    var tzStr = new Intl.DateTimeFormat("en-US", {
      timeZone: tzName, hour:"numeric", hour12:false, timeZoneName:"short"
    }).format(date);
    // Use the difference in formatted hours
    var fmt = new Intl.DateTimeFormat("en-US", {
      timeZone: tzName,
      hour:"2-digit", minute:"2-digit", hour12:false
    });
    var utcFmt = new Intl.DateTimeFormat("en-US", {
      timeZone: "UTC",
      hour:"2-digit", minute:"2-digit", hour12:false
    });
    var tzParts = fmt.format(date).split(":").map(Number);
    var utcParts = utcFmt.format(date).split(":").map(Number);
    var diff = (tzParts[0]*60 + tzParts[1]) - (utcParts[0]*60 + utcParts[1]);
    // Handle day boundary
    if(diff > 720) diff -= 1440;
    if(diff < -720) diff += 1440;
    return diff / 60;
  } catch(e){ return 0; }
}

function fmtOffset(h){
  var sign = h >= 0 ? "+" : "-";
  var abs = Math.abs(h);
  var hh = Math.floor(abs);
  var mm = Math.round((abs - hh) * 60);
  return "UTC" + sign + (hh<10?"0":"") + hh + (mm?":"+("0"+mm).slice(-2):"");
}

  updateTerminator();
}

// カレンダー入力(日付のみ)が変更された時: 現在の時刻(時:分)を保持して日付だけ差し替え
function onCustomDateChange(){
  var val = document.getElementById("custom-date").value; // "YYYY-MM-DD"
  if(!val) return;
  var h = customUTCDate ? customUTCDate.getUTCHours()   : 12;
  var m = customUTCDate ? customUTCDate.getUTCMinutes() : 0;
  var d = new Date(val + "T00:00:00Z");
  if(isNaN(d.getTime())) return;
  d.setUTCHours(h, m, 0, 0);
  customUTCDate = d;
  updateTerminator();
}

// 前日/翌日ボタン: 1日ずつ増減(月またぎ・年またぎも自動処理される)
function stepDay(delta){
  if(!customUTCDate) customUTCDate = new Date();
  var d = new Date(customUTCDate.getTime());
  d.setUTCDate(d.getUTCDate() + delta);
  customUTCDate = d;
  syncCustomDateTimeUI();
  updateTerminator();
}

// 分単位の微調整(時・日またぎも自動処理される)
function stepMinute(delta){
  if(!customUTCDate) customUTCDate = new Date();
  var d = new Date(customUTCDate.getTime());
  d.setUTCMinutes(d.getUTCMinutes() + delta);
  customUTCDate = d;
  syncCustomDateTimeUI();
  updateTerminator();
}

// < > ボタン: 1時間ずつ増減(日付またぎも自動的に処理される)
function stepHour(delta){
  if(!customUTCDate) customUTCDate = new Date();
  var d = new Date(customUTCDate.getTime());
  d.setUTCHours(d.getUTCHours() + delta);
  customUTCDate = d;
  syncCustomDateTimeUI();
  updateTerminator();
}

// 時刻(時:分)を直接入力した時
function onCustomTimeChange(){
  var val = document.getElementById("custom-time").value; // "HH:MM"
  if(!val) return;
  var parts = val.split(":");
  var h = parseInt(parts[0],10), m = parseInt(parts[1],10);
  if(isNaN(h)||isNaN(m)) return;
  if(!customUTCDate) customUTCDate = new Date();
  var d = new Date(customUTCDate.getTime());
  d.setUTCHours(h, m, 0, 0);
  customUTCDate = d;
  updateTerminator();
}

// customUTCDate の内容をカレンダー入力・時刻入力に反映
function syncCustomDateTimeUI(){
  if(!customUTCDate) customUTCDate = new Date();
  var d = customUTCDate;
  var dateStr = d.getUTCFullYear()+"-"+pad2(d.getUTCMonth()+1)+"-"+pad2(d.getUTCDate());
  var dateInput = document.getElementById("custom-date");
  if(dateInput) dateInput.value = dateStr;
  var timeInput = document.getElementById("custom-time");
  if(timeInput) timeInput.value = pad2(d.getUTCHours())+":"+pad2(d.getUTCMinutes());
}

function setPreset(preset){
  var yr = new Date().getUTCFullYear();
  var presets = {
    "equinox-mar":  {mo:2,  dy:20, h:12},
    "solstice-jun": {mo:5,  dy:21, h:12},
    "equinox-sep":  {mo:8,  dy:23, h:12},
    "solstice-dec": {mo:11, dy:21, h:12}
  };
  var p = presets[preset];
  if(!p) return;
  var d = new Date(Date.UTC(yr, p.mo, p.dy, p.h, 0, 0));
  customUTCDate = d;
  realtimeMode = false;
  document.getElementById("chk-realtime").checked = false;
  var row = document.getElementById("custom-dt-row");
  if(row) row.style.display = "flex";
  syncCustomDateTimeUI();
  updateTerminator();
}

function clearTerminator(){
  if(terminatorGroup){
    terminatorGroup.children.slice().forEach(function(ch){
      if(ch.geometry) ch.geometry.dispose();
      if(ch.material) ch.material.dispose();
    });
    scene.remove(terminatorGroup);
    terminatorGroup = null;
  }
}

/* ═══════════════════════════════════════════
   SUBSOLAR POINT  (NOAA / Jean Meeus準拠)
   精密版: 黄道傾斜・近点角・均時差を含む
═══════════════════════════════════════════ */
function subsolarPoint(date){
  // Julian Day Number
  var JD = date.getTime()/86400000.0 + 2440587.5;
  var n  = JD - 2451545.0; // J2000.0からの日数

  // 太陽の平均経度 (度)
  var L0 = (280.46646 + 0.9856474*n) % 360;
  if(L0 < 0) L0 += 360;

  // 太陽の平均近点角 (度)
  var M  = (357.52911 + 0.98560028*n) % 360;
  if(M < 0) M += 360;
  var Mrad = M * Math.PI/180;

  // 中心差 (太陽の方程式)
  var C = (1.914602 - 0.004817*n/36525 - 0.000014*(n/36525)*(n/36525)) * Math.sin(Mrad)
        + (0.019993 - 0.000101*n/36525) * Math.sin(2*Mrad)
        + 0.000289 * Math.sin(3*Mrad);

  // 太陽の真経度 (度)
  var sunLon = L0 + C;

  // 太陽の真近点角
  var v = M + C;

  // 地心距離 (AU) - 精度改善のため計算
  // var R = 1.000001018*(1-0.01671123*0.01671123)/(1+0.01671123*Math.cos(v*Math.PI/180));

  // 黄道傾斜 (度) - 章動・補正込み
  var epsilon0 = 23.439291 - 0.013004*n/36525;
  // 黄道傾斜の章動補正 (簡略)
  var omega = (125.04 - 0.052954*n) * Math.PI/180;
  var epsilon = epsilon0 + 0.00256*Math.cos(omega);
  var epsRad  = epsilon * Math.PI/180;

  // 視赤経・赤緯
  var sunLonRad = sunLon * Math.PI/180;
  var sinDec = Math.sin(epsRad) * Math.sin(sunLonRad);
  var decl   = Math.asin(sinDec) * 180/Math.PI; // 赤緯 (度)

  // 均時差 (Equation of Time, 分)
  var y    = Math.tan(epsRad/2) * Math.tan(epsRad/2);
  var L0r  = L0 * Math.PI/180;
  var e    = 0.016708634 - 0.000042037*(n/36525);
  var EqT  = (y*Math.sin(2*L0r)
             - 2*e*Math.sin(Mrad)
             + 4*e*y*Math.sin(Mrad)*Math.cos(2*L0r)
             - 0.5*y*y*Math.sin(4*L0r)
             - 1.25*e*e*Math.sin(2*Mrad)) * (180/Math.PI) * 4; // 分

  // UTCから太陽の経度を計算
  var utcMin = date.getUTCHours()*60 + date.getUTCMinutes() + date.getUTCSeconds()/60;
  // 太陽が真南に来る時刻 (UTC, 分) = 720 - EqT (グリニッジ基準)
  // 対日点経度 = UTC時刻から求めた太陽の地方時角に対応する経度
  var solarNoonOffset = EqT; // 分
  // 太陽の経度 (グリニッジ子午線からの角度)
  // UTC正午に太陽はEqT分だけずれた位置にある
  var sunLonDeg = -(utcMin - 720 - solarNoonOffset) / 4; // 4分/度
  while(sunLonDeg >  180) sunLonDeg -= 360;
  while(sunLonDeg < -180) sunLonDeg += 360;

  return {lat: decl, lon: sunLonDeg};
}

/* ═══════════════════════════════════════════
   TERMINATOR (昼夜境界線)
   正しいアルゴリズム: astrogreg.com準拠
   各経度λに対してtanφ = -cos(ha)/tan(φ_sun)
═══════════════════════════════════════════ */
function makeEmojiSprite(emoji, sizePx, scale, color){
  var cv = document.createElement("canvas");
  cv.width = sizePx; cv.height = sizePx;
  var ctx = cv.getContext("2d");
  ctx.clearRect(0,0,sizePx,sizePx);
  // 絵文字を一度グレーで描いてからcompositeで色付け
  ctx.font = Math.round(sizePx*0.75)+"px serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = color || "#ffffff";
  // source-over で白抜き
  ctx.fillText(emoji, sizePx/2, sizePx/2);
  var tex = new THREE.CanvasTexture(cv);
  var mat = new THREE.SpriteMaterial({map:tex, transparent:true, depthTest:false, color: new THREE.Color(color||"#ffffff")});
  var sp  = new THREE.Sprite(mat);
  sp.scale.set(scale, scale, 1);
  return sp;
}

function buildTerminator(){
  clearTerminator();
  terminatorGroup = new THREE.Group();
  scene.add(terminatorGroup);

  var d   = getDisplayDate();
  var sub = subsolarPoint(d);

  // 太陽の赤緯と経度 (rad)
  var declRad  = sub.lat * Math.PI / 180;
  var sunLonDeg = sub.lon;

  // 太陽方向の単位ベクトル (ll2v と同じ座標系に合わせる)
  // ll2v: x= cos(lat)cos(lon), y=sin(lat), z=-cos(lat)sin(lon)  ← Z が反転
  var _lonRad = sunLonDeg * Math.PI/180;
  var sunX =  Math.cos(declRad) * Math.cos(_lonRad);
  var sunY =  Math.sin(declRad);
  var sunZ = -Math.cos(declRad) * Math.sin(_lonRad);  // ll2v と合わせてZ反転

  // ShaderMaterial で昼夜色分けするため、グリッドオーバーレイは不要

  // ── マーカー: terminatorGroup の外に配置（クォータニオンが二重適用されないよう）──
  // 太陽・対蹠点の 3D 座標は sunX/Y/Z から直接計算

  // 太陽マーカー (☀ スプライト)
  var sunPos = new THREE.Vector3(sunX * GR*1.001, sunY * GR*1.001, sunZ * GR*1.001);
  var sunSprite = makeEmojiSprite("☀", 128, 0.38, "#ffe88a");
  sunSprite.position.copy(sunPos);
  terminatorGroup.add(sunSprite);
  terminatorGroup.userData.sunSprite = sunSprite;
  terminatorGroup.userData.sunLocalPos = sunPos.clone();

  // ── 太陽情報表示 ──
  // sun-info 廃止（赤緯経度表示なし）

  // sunX/Y/Z を userData に保存（animate から参照するため）
  terminatorGroup.userData.sunX = sunX;
  terminatorGroup.userData.sunY = sunY;
  terminatorGroup.userData.sunZ = sunZ;

  terminatorGroup.quaternion.copy(globeQ);

  // ── Shader uniform を更新: 太陽方向（ワールド座標）──
  // 地球 mesh は globeQ で回転 → vWorldNormal はワールド座標
  // sunX/Y/Z は地球ローカル → globeQ を適用してワールドへ
  if(sunUniforms){
    var sv = new THREE.Vector3(sunX, sunY, sunZ);
    sv.applyQuaternion(globeQ);
    sunUniforms.sunDir.value.copy(sv);
  }
}

function updateTerminator(){
  if(terminatorOn) buildTerminator();
  // 日付・時刻の変更を月齢パネルにも即時反映
  if(typeof updateMoonPanel === "function") updateMoonPanel();
}

function showTZPanel(ap, mx, my){
  var p = document.getElementById("tz-panel");

  var tz = apTZ(ap.c);
  var now = getDisplayDate();
  document.getElementById("tz-ap").textContent   = apCity(ap) + " " + ap.c;

  if(getValid().length > 0 && getValid()[0].c !== ap.c){
    var baseOff = tzOffsetHours(localBase, now);
    var diff = off - baseOff;
    var sign = diff>=0?"+":"-";
    document.getElementById("tz-diff").textContent =
      getValid()[0].c + t("tz_diff") + sign + Math.abs(diff).toFixed(1) + "h";
  } else {
    document.getElementById("tz-diff").textContent = "";
  }
  document.getElementById("tz-name").textContent = tz + " " + fmtOffset(off);

/* ═══════════════════════════════════════════════════
   月齢・月相の計算  (Jean Meeus "Astronomical Algorithms")
     月の黄経    : Ch.47 Table 47.A (主要59項 + 加法項)
     太陽の真黄経 : Ch.25 (中心差 + 光行差)
     月齢        : 直前の朔(太陽との合)の瞬間をニュートン法で求める「真月齢」
   検証: Ch.49 の朔時刻計算式と独立に照合し、2024-2029年の62朔で最大差 2.2分
═══════════════════════════════════════════════════ */
var MOON_SYNODIC    = 29.530588861;   // 平均朔望月 [日]
var MOON_LIT_COLOR  = "#ffe090";      // 輝面の色
var MOON_DARK_COLOR = "#150e04";      // 暗部の色

function moonNorm360(a){ a = a % 360; return a < 0 ? a + 360 : a; }

// Meeus Table 47.A : [D, M, M', F, 係数(1e-6度), Eの次数]
var MOON_LON_TERMS = [
[0,0,1,0,6288774,0],[2,0,-1,0,1274027,0],[2,0,0,0,658314,0],[0,0,2,0,213618,0],
[0,1,0,0,-185116,1],[0,0,0,2,-114332,0],[2,0,-2,0,58793,0],[2,-1,-1,0,57066,1],
[2,0,1,0,53322,0],[2,-1,0,0,45758,1],[0,1,-1,0,-40923,1],[1,0,0,0,-34720,0],
[0,1,1,0,-30383,1],[2,0,0,-2,15327,0],[0,0,1,2,-12528,0],[0,0,1,-2,10980,0],
[4,0,-1,0,10675,0],[0,0,3,0,10034,0],[4,0,-2,0,8548,0],[2,1,-1,0,-7888,1],
[2,1,0,0,-6766,1],[1,0,-1,0,-5163,0],[1,1,0,0,4987,1],[2,-1,1,0,4036,1],
[2,0,2,0,3994,0],[4,0,0,0,3861,0],[2,0,-3,0,3665,0],[0,1,-2,0,-2689,1],
[2,0,-1,2,-2602,0],[2,-1,-2,0,2390,1],[1,0,1,0,-2348,0],[2,-2,0,0,2236,2],
[0,1,2,0,-2120,1],[0,2,0,0,-2069,2],[2,-2,-1,0,2048,2],[2,0,1,-2,-1773,0],
[2,0,0,2,-1595,0],[4,-1,-1,0,1215,1],[0,0,2,2,-1110,0],[3,0,-1,0,-892,0],
[2,1,1,0,-810,1],[4,-1,-2,0,759,1],[0,2,-1,0,-713,2],[2,2,-1,0,-700,2],
[2,1,-2,0,691,1],[2,-1,0,-2,596,1],[4,0,1,0,549,0],[0,0,4,0,537,0],
[4,-1,0,0,520,1],[1,0,-2,0,-487,0],[2,1,0,-2,-399,1],[0,0,2,-2,-381,0],
[1,1,1,0,351,1],[3,0,-2,0,-340,0],[4,0,-3,0,330,0],[2,-1,2,0,327,1],
[0,2,1,0,-323,2],[1,1,-1,0,299,1],[2,0,3,0,294,0]
];

// 月の黄経 [度]  (T = J2000からのユリウス世紀)
function moonEclipticLon(T){
  var Lp = 218.3164477 + 481267.88123421*T - 0.0015786*T*T + T*T*T/538841 - T*T*T*T/65194000;
  var D  = 297.8501921 + 445267.1114034*T  - 0.0018819*T*T + T*T*T/545868 - T*T*T*T/113065000;
  var M  = 357.5291092 + 35999.0502909*T   - 0.0001536*T*T + T*T*T/24490000;
  var Mp = 134.9633964 + 477198.8676313*T  + 0.0089970*T*T + T*T*T/69699  - T*T*T*T/14712000;
  var F  = 93.2720950  + 483202.0175233*T  - 0.0036539*T*T - T*T*T/3526000 + T*T*T*T/863310000;
  var E = 1 - 0.002516*T - 0.0000074*T*T, E2 = E*E;
  var RAD = Math.PI/180;
  var Dr = D*RAD, Mr = M*RAD, Mpr = Mp*RAD, Fr = F*RAD;
  var s = 0;
  for(var i=0; i<MOON_LON_TERMS.length; i++){
    var tm = MOON_LON_TERMS[i], c = tm[4];
    if(tm[5] === 1) c *= E; else if(tm[5] === 2) c *= E2;
    s += c * Math.sin(tm[0]*Dr + tm[1]*Mr + tm[2]*Mpr + tm[3]*Fr);
  }
  // 加法項 (金星・木星の摂動および地球の扁平性)
  s += 3958*Math.sin((119.75 + 131.849*T)*RAD)
     + 1962*Math.sin(Lp*RAD - Fr)
     +  318*Math.sin((53.09 + 479264.290*T)*RAD);
  return moonNorm360(Lp + s/1000000);
}

// 太陽の真黄経 [度] (光行差込み)
function sunEclipticLon(T){
  var RAD = Math.PI/180;
  var L0 = 280.46646 + 36000.76983*T + 0.0003032*T*T;
  var M  = (357.52911 + 35999.05029*T - 0.0001537*T*T) * RAD;
  var C  = (1.914602 - 0.004817*T - 0.000014*T*T)*Math.sin(M)
         + (0.019993 - 0.000101*T)*Math.sin(2*M)
         +  0.000289*Math.sin(3*M);
  return moonNorm360(L0 + C - 0.00569);
}

// 月と太陽の黄経差 [度]  0=朔, 90=上弦, 180=望, 270=下弦
function moonPhaseAngle(JD){
  var T = (JD - 2451545.0) / 36525.0;
  return moonNorm360(moonEclipticLon(T) - sunEclipticLon(T));
}
// 最寄りの合からの符号つき角距離 (-180, 180]
function moonPhaseSigned(JD){ return ((moonPhaseAngle(JD) + 180) % 360) - 180; }

// 合(朔)の瞬間をニュートン法で精密化
function moonRefineNewMoon(guess){
  var t = guess;
  for(var i=0; i<6; i++){
    var f = moonPhaseSigned(t);
    var d = (moonPhaseSigned(t+0.05) - moonPhaseSigned(t-0.05)) / 0.1;
    if(!(d > 5 && d < 20)) d = 360 / MOON_SYNODIC;  // ±180°の折返しを跨いだ場合の保険
    var step = f / d;
    t -= step;
    if(Math.abs(step) < 1e-8) break;
  }
  return t;
}

// 直前の朔のユリウス日 (最短朔望月 29.27日 を下回らないのでその間はキャッシュ)
var _moonNewMoonCache = { from: 1, to: 0, jd: 0 };
function moonLastNewMoon(JD){
  var c = _moonNewMoonCache;
  if(JD >= c.from && JD < c.to) return c.jd;
  var t = moonRefineNewMoon(JD - moonPhaseAngle(JD)/360*MOON_SYNODIC);
  if(t > JD + 1e-6) t = moonRefineNewMoon(t - MOON_SYNODIC);
  _moonNewMoonCache = { from: t, to: t + 29.2, jd: t };
  return t;
}

// 月齢・輝面比・位相角
function calcMoon(date){
  var JD = date.getTime()/86400000.0 + 2440587.5;
  var elong = moonPhaseAngle(JD);
  return {
    age:   JD - moonLastNewMoon(JD),              // 真月齢 [日] 0〜約29.8
    illum: (1 - Math.cos(elong*Math.PI/180)) / 2, // 輝面比 0〜1
    elong: elong                                  // 位相角 [度]
  };
}

// 楕円弧 (ctx.ellipse 非対応環境へのフォールバックつき)
function moonEllipseArc(ctx, cx, cy, rx, ry, a0, a1, acw){
  if(ctx.ellipse){ ctx.ellipse(cx, cy, rx, ry, 0, a0, a1, acw); return; }
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(Math.max(rx, 1e-4)/ry, 1);
  ctx.arc(0, 0, ry, a0, a1, acw);
  ctx.restore();
}

// 月相をCanvasに描画 (北半球の見えかた: 満ちていく月は右が輝く)
function drawMoonPhase(canvas, elong){
  // 初回のみ高DPI対応: 表示サイズを固定しバッキングストアを拡大
  var size = parseFloat(canvas.getAttribute("data-css-size") || "");
  if(!size){
    size = canvas.width;
    var dpr = Math.min(3, window.devicePixelRatio || 1);
    canvas.setAttribute("data-css-size", size);
    canvas.style.width  = size + "px";
    canvas.style.height = size + "px";
    canvas.width  = Math.round(size * dpr);
    canvas.height = Math.round(size * dpr);
  }
  var ctx = canvas.getContext("2d");
  ctx.setTransform(canvas.width/size, 0, 0, canvas.height/size, 0, 0);

  var PI = Math.PI;
  var r = size/2 - 4, cx = size/2, cy = size/2;
  ctx.clearRect(0, 0, size, size);

  var k = (1 - Math.cos(elong*PI/180)) / 2;  // 輝面比
  var waxing   = elong < 180;                // 満ちていく月か
  var crescent = k < 0.5;                    // 三日月形か(凸形でないか)
  var a = Math.max(r * Math.abs(1 - 2*k), 1e-4); // 明暗境界線(楕円)の短半径

  // 暗部
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, 2*PI);
  ctx.fillStyle = MOON_DARK_COLOR;
  ctx.fill();

  // 輝面 = 輝く側のリム半円 + 明暗境界の半楕円
  if(k > 0.0015){
    var termRight = (waxing === crescent);   // 明暗境界が右に膨らむか
    ctx.beginPath();
    ctx.arc(cx, cy, r, -PI/2, PI/2, !waxing);
    moonEllipseArc(ctx, cx, cy, a, r, PI/2, termRight ? -PI/2 : PI*1.5, termRight);
    ctx.closePath();
    ctx.fillStyle = MOON_LIT_COLOR;
    ctx.fill();
  }

  // 縁
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, 2*PI);
  ctx.strokeStyle = "rgba(150,170,200,0.35)";
  ctx.lineWidth = 1;
  ctx.stroke();
}

// 月齢パネル更新 (月齢数値 + 月相図)

  positionMoonPanel();
}

function t(key){ return I18N[lang][key] || I18N.ja[key] || key; }

function applyI18N(){
  document.querySelectorAll("[data-i18n]").forEach(function(el){
    el.textContent = t(el.dataset.i18n);
  });
  document.querySelectorAll("[data-i18n-placeholder]").forEach(function(el){
    el.placeholder = t(el.dataset.i18nPlaceholder);
  });
  document.querySelectorAll("[data-i18n-title]").forEach(function(el){
    el.title = t(el.dataset.i18nTitle);
  });
}

function setLang(l){
  lang = l;
  document.querySelectorAll(".lang-btn").forEach(function(b){
    b.classList.toggle("on", b.dataset.lang === l);
  });
  applyI18N();
  renderList();
  if(typeof rebuildSlots === "function"){ rebuildSlots(); }
  updHint();
  updInfo();
  updateRings();
  if(typeof updateMoonPanel === "function") updateMoonPanel();
}


/* ═══════════════════════════════════════════════════
   MOBILE UI CONTROL (768px以下でのみ機能)
   PC幅では isMobile() が false になり、すべて no-op になる
═══════════════════════════════════════════════════ */
function isMobile(){ return window.matchMedia("(max-width:768px)").matches; }

// 現在開いているパネルID（null = 全閉じ）
var _mOpen = null;

function mCloseAll(){
  var ctrl = document.getElementById("ctrl");
  if(ctrl){
    ctrl.classList.remove("m-open");
    ctrl.classList.remove("m-full");   // 拡大状態もリセット
    var eb = document.getElementById("m-expand-btn");
    if(eb) eb.textContent = "⤢";
  }
  ["legend","terminator-wrap"].forEach(function(id){
    var el = document.getElementById(id);
    if(el) el.classList.remove("m-open");
  });
  document.querySelectorAll(".m-tab").forEach(function(t){ t.classList.remove("on"); });
  var bd = document.getElementById("m-backdrop");
  if(bd) bd.classList.remove("on");
  _mOpen = null;
}

// 空港リスト(ボトムシート)の開閉
function mToggleSheet(){
  if(!isMobile()) return;
  var ctrl = document.getElementById("ctrl");
  if(!ctrl) return;
  var wasOpen = (_mOpen === "ctrl");
  mCloseAll();
  if(!wasOpen){
    ctrl.classList.add("m-open");
    document.getElementById("m-backdrop").classList.add("on");
    var tab = document.getElementById("m-tab-list");
    if(tab) tab.classList.add("on");
    _mOpen = "ctrl";
  }
}

// 昼夜/凡例パネルの開閉
function mTogglePanel(id, btn){
  if(!isMobile()) return;
  var el = document.getElementById(id);
  if(!el) return;
  var wasOpen = (_mOpen === id);
  mCloseAll();
  if(!wasOpen){
    el.classList.add("m-open");
    document.getElementById("m-backdrop").classList.add("on");
    if(btn) btn.classList.add("on");
    _mOpen = id;
  }
}

// シートを全画面まで拡大 / 元に戻す
function mToggleExpand(){
  if(!isMobile()) return;
  var ctrl = document.getElementById("ctrl");
  var btn  = document.getElementById("m-expand-btn");
  if(!ctrl) return;
  var full = ctrl.classList.toggle("m-full");
  if(btn){
    btn.textContent = full ? "⤡" : "⤢";
    btn.setAttribute("aria-label", full ? "シートを縮小" : "シートを拡大");
  }
}

// 空港を選んだらシートを自動で閉じ、地球と情報パネルを見せる
function mAutoCloseOnSelect(){
  if(isMobile() && _mOpen === "ctrl") mCloseAll();
}

// PC⇄スマホをまたぐリサイズ時に状態をリセットしてレイアウト崩れを防ぐ
window.addEventListener("resize", function(){
  if(!isMobile() && _mOpen) mCloseAll();
});

// Global error handler
window.onerror = function(msg, src, line, col, err){
  console.error("[AirportGlobe]", msg, "L"+line+":"+col, err&&err.stack||"");
  return false;
};

// startApp: THREE.js読み込み完了を待ってから起動
function startApp(){
  try {
    init();
    applyI18N();        // 初回言語適用
    buildTerminator(); // デフォルトON
    updateMoonPanel();
    // UTCクロック
    setInterval(function(){
      updateClock();
      if(typeof updateMoonPanel==="function") updateMoonPanel();
      // legs内のtz表示を更新
      var legs = document.getElementById("legs");
      if(legs){
        var oldTz = legs.querySelector(".leg-tz");
        if(oldTz){
          var html = tzRowHTML();
          if(html){ var tmp=document.createElement("div"); tmp.innerHTML=html; if(tmp.firstChild) legs.replaceChild(tmp.firstChild,oldTz); }
        }
      }
    }, 1000);
    updateClock();
  } catch(e) {
    console.error("[AirportGlobe] init failed:", e);
    var errDiv = document.createElement("div");
    errDiv.style.cssText = "position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#1a0a0a;border:1px solid #ff4444;border-radius:12px;padding:24px 32px;color:#ff8888;font-family:sans-serif;z-index:9999;text-align:center";
    errDiv.innerHTML = "<div style='font-size:18px;font-weight:700;margin-bottom:8px'>初期化エラー</div><div style='font-size:12px;opacity:0.7'>"+esc(e.message)+"</div>";
    document.body.appendChild(errDiv);
  }
}

if(document.readyState==="loading"){
  document.addEventListener("DOMContentLoaded", startApp);
} else {
  startApp();
}
